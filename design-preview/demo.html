<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 选宠 / 百科问答 · 可交互演示</title>
<style>
:root{
  --brand-50:#eff6f3;--brand-100:#dcede6;--brand-200:#b9dbce;--brand-300:#8fc3b0;
  --brand-400:#4f9f87;--brand-500:#1f7a63;--brand-600:#14614e;--brand-700:#0f4e3f;--brand-800:#0c4034;
  --success-500:#15803d;--success-50:#f0fdf4;--success-100:#dcfce7;
  --warning-500:#b45309;--warning-50:#fffbeb;
  --danger-500:#dc2626;--danger-50:#fef2f2;
  --text-1:#16211d;--text-2:#4a5a54;--text-3:#63716b;--text-4:#aeb8b3;
  --border-1:#e4eae6;--border-2:#edf1ee;
  --bg-page:#f8faf9;--bg-sunken:#e9f0ec;--bg-card:#fff;
  --price:#a8542b;
  --r-xs:6px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--r-pill:999px;
  --sh-card:0 1px 2px rgba(22,25,23,.05);
  --sh-sm:0 1px 3px rgba(22,25,23,.05),0 4px 12px -2px rgba(22,25,23,.06);
  --sh-float:0 2px 6px rgba(22,25,23,.04),0 16px 32px -12px rgba(22,25,23,.14);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono","JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font-family:var(--font);background:#eef2f0;color:var(--text-1);-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* ---------- 演示工具条 ---------- */
.bar{
  position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:9px 20px;background:#1b2a25;color:#fff;
}
.bar-l{display:flex;align-items:center;gap:9px}
.bar-l b{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.bar-l .tag{
  padding:2px 7px;border-radius:var(--r-xs);background:rgba(255,255,255,.12);
  font-size:11px;color:#cfe3da;
}
.bar-c{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;padding:2px;background:rgba(255,255,255,.1);border-radius:9px}
.seg button{
  height:26px;padding:0 12px;border:0;border-radius:7px;background:transparent;
  font-size:12px;font-weight:600;color:#c4d6ce;cursor:pointer;transition:.15s;
}
.seg button:hover{color:#fff}
.seg button.on{background:#fff;color:var(--brand-700)}
.bar a{
  font-size:12px;color:#cfe3da;text-decoration:none;padding:5px 9px;border-radius:7px;
  background:rgba(255,255,255,.1);
}
.bar a:hover{color:#fff;background:rgba(255,255,255,.18)}

/* ---------- 应用外壳 ---------- */
#app{background:var(--bg-page);min-height:calc(100vh - 44px)}
.bnav{display:flex;align-items:center;gap:26px;height:58px;padding:0 22px;background:#fff;border-bottom:1px solid var(--border-1)}
.logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:-.01em}
.logo i{width:19px;height:19px;border-radius:7px;background:var(--brand-600);position:relative;display:block}
.logo i::after{content:"";position:absolute;inset:6px 5px;border-radius:50% 50% 50% 0;background:#fff;transform:rotate(-45deg)}
.menu{display:flex;gap:3px}
.menu button{
  padding:6px 11px;border:0;border-radius:var(--r-sm);background:transparent;
  font-size:12.5px;color:var(--text-2);cursor:pointer;
}
.menu button.on{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.nava{margin-left:auto;width:24px;height:24px;border-radius:50%;background:var(--bg-sunken)}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}

.eb{
  display:inline-flex;align-items:center;gap:7px;padding:4px 11px 4px 9px;
  background:#fff;border:1px solid var(--border-1);border-radius:var(--r-pill);
  font-size:11.5px;color:var(--text-2);box-shadow:var(--sh-card);
}
.eb i{width:5px;height:5px;border-radius:50%;background:var(--brand-500)}

.card{background:#fff;border:1px solid var(--border-1);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 17px;
  border:1px solid transparent;border-radius:var(--r-md);font-size:13px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:.16s;
}
.btn--solid{background:var(--brand-600);color:#fff}
.btn--solid:hover{background:var(--brand-700)}
.btn--line{background:#fff;border-color:var(--border-1);color:var(--text-1)}
.btn--line:hover{border-color:var(--brand-300);color:var(--brand-700)}
.btn--ghost{background:transparent;color:var(--text-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn--sm{height:32px;padding:0 13px;font-size:12.5px}
.btn--full{width:100%}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r-xs);font-size:11.5px;font-weight:600;background:var(--bg-page);color:var(--text-3);white-space:nowrap}
.chip--brand{background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-100)}
.chip--warn{background:var(--warning-50);color:var(--warning-500)}
.chip--ok{background:var(--success-50);color:var(--success-500)}
.chip--danger{background:var(--danger-50);color:var(--danger-500)}

/* ---------- 选宠：页头 ---------- */
.phead{padding:30px 0 22px}
.phead h1{margin:13px 0 0;font-size:29px;line-height:1.26;font-weight:700;letter-spacing:-.018em}
.phead h1 .hl{background:linear-gradient(to top,var(--brand-100) 0 34%,transparent 34%);padding:0 2px;color:var(--brand-800)}
.phead>p{margin:9px 0 0;max-width:36em;font-size:13px;line-height:1.8;color:var(--text-2)}
.qfill{display:flex;align-items:center;gap:9px;margin-top:16px;padding:6px 7px 6px 14px;background:#fff;border:1px solid var(--border-1);border-radius:var(--r-pill);box-shadow:var(--sh-card)}
.qfill .k{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.qfill input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:12.5px;color:var(--text-1)}
.qfill input::placeholder{color:var(--text-4)}
.qfill .btn{height:31px;border-radius:var(--r-pill);font-size:12.5px}
.aihint{display:flex;align-items:center;gap:7px;margin:10px 0 0;padding:8px 12px;background:var(--success-50);border:1px solid var(--success-100);border-radius:var(--r-sm);font-size:12px;color:var(--success-500)}
.aihint b{font-weight:600}

/* ---------- 选宠：向导布局 ---------- */
.wz{display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;padding-bottom:44px;align-items:start}
.wzside{position:sticky;top:60px}
.steps{display:flex;flex-direction:column;gap:1px}
.step{
  display:flex;align-items:center;gap:9px;padding:12px 12px;border:0;border-left:2px solid transparent;
  border-radius:var(--r-md);background:transparent;cursor:pointer;text-align:left;transition:.15s;
}
.step:hover{background:rgba(255,255,255,.6)}
.step.on{background:#fff;border-left-color:var(--brand-600);box-shadow:var(--sh-sm)}
.step .no{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--brand-600);width:16px;flex-shrink:0}
.step.done .no{color:var(--success-500)}
.step .tx{min-width:0;flex:1}
.step b{display:block;font-size:13px;font-weight:600}
.step em{display:block;margin-top:1px;font-style:normal;font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .cnt{font-size:10.5px;color:var(--text-4);font-variant-numeric:tabular-nums;flex-shrink:0}
.step.done .cnt{color:var(--success-500)}
.prog{margin-top:18px;padding:13px;background:#fff;border:1px solid var(--border-1);border-radius:var(--r-md)}
.prog-top{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3)}
.prog-top b{font-size:11.5px;color:var(--brand-700)}
.bar{height:5px;margin-top:8px;background:var(--bg-sunken);border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:var(--r-pill);background:var(--brand-600);transition:width .3s ease}
.tip{margin:13px 0 0;font-size:11px;line-height:1.7;color:var(--text-3)}

.wzmain{min-width:0}
.qcard{padding:24px 26px 10px}
.qhead{display:flex;align-items:center;gap:11px;padding-bottom:14px;border-bottom:1px solid var(--border-2)}
.qno{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:var(--brand-50);font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--brand-700)}
.qhead h2{margin:0;font-size:15.5px;font-weight:700}
.qhead p{margin:2px 0 0;font-size:11.5px;color:var(--text-3)}
.q{padding:18px 0 8px}
.q+.q{border-top:1px dashed var(--border-2)}
.qt{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:600;margin-bottom:10px}
.qt span{font-size:11.5px;font-weight:400;color:var(--text-3)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:8px}
.opt{
  display:flex;flex-direction:column;gap:2px;padding:12px 14px;text-align:left;background:#fff;
  border:1px solid var(--border-1);border-radius:var(--r-md);cursor:pointer;transition:.14s;
}
.opt b{font-size:13px;font-weight:600;line-height:1.4;color:var(--text-1)}
.opt em{font-style:normal;font-size:11px;line-height:1.5;color:var(--text-3)}
.opt:hover{border-color:var(--brand-300);background:var(--brand-50)}
.opt.on{border-color:var(--brand-600);background:var(--brand-50);box-shadow:inset 0 0 0 1px var(--brand-600)}
.opt.on b{color:var(--brand-800)}
.wzfoot{display:flex;align-items:center;gap:12px;margin-top:12px;padding:11px 16px;background:#fff;border:1px solid var(--border-1);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.dots{display:flex;gap:6px;margin:0 auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--border-1);transition:.2s}
.dots i.on{width:18px;border-radius:var(--r-pill);background:var(--brand-600)}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- 选宠：分析中 ---------- */
.analyzing{padding:74px 20px;text-align:center}
.ring-spin{width:52px;height:52px;margin:0 auto 20px;border-radius:50%;border:3px solid var(--brand-100);border-top-color:var(--brand-600);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing h3{margin:0 0 7px;font-size:16px;font-weight:700}
.analyzing p{margin:0;font-size:12.5px;color:var(--text-3)}

/* ---------- 选宠：结果 ---------- */
.rhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 22px;margin-bottom:14px}
.rhead .rh{display:inline-block;padding:3px 9px;background:var(--brand-50);border-radius:var(--r-xs);font-size:11px;font-weight:600;color:var(--brand-700)}
.rhead h2{margin:9px 0 5px;font-size:18px;font-weight:700;line-height:1.5}
.rhead p{margin:0;font-size:11.5px;line-height:1.7;color:var(--text-3)}
.rhead p .on{color:var(--success-500)}
.top{display:grid;grid-template-columns:330px minmax(0,1fr);background:#fff;border:1px solid var(--border-1);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm)}
.topimg{position:relative;min-height:330px;background:linear-gradient(150deg,var(--brand-100),var(--bg-sunken) 60%,#dbe7e1);cursor:pointer;display:grid;place-items:center}
.topimg .ph{font-size:12.5px;color:var(--brand-700);background:#fff;padding:7px 14px;border-radius:var(--r-pill);border:1px solid var(--border-1)}
.crown{position:absolute;left:13px;top:13px;padding:4px 10px;background:var(--brand-600);border-radius:var(--r-pill);font-size:11px;font-weight:600;color:#fff}
.tpmain{display:flex;flex-direction:column;gap:14px;padding:22px 24px;min-width:0}
.tphead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.tpcat{font-size:11.5px;color:var(--text-3)}
.tpid h3{margin:4px 0 7px;font-size:23px;font-weight:700}
.tpprice{font-size:21px;font-weight:700;color:var(--price);font-variant-numeric:tabular-nums}
.tpprice em{margin-left:7px;font-style:normal;font-size:11.5px;font-weight:400;color:var(--text-3)}
.scorering{position:relative;width:82px;height:82px;flex-shrink:0}
.scorering svg{width:82px;height:82px;display:block}
.scorering .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scorering .val strong{font-size:21px;font-weight:700;line-height:1;color:var(--brand-700);font-variant-numeric:tabular-nums}
.scorering .val span{margin-top:2px;font-size:10px;color:var(--text-3)}
.dims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 20px;padding:12px 15px;background:var(--bg-page);border-radius:var(--r-md)}
.dim{display:flex;align-items:center;gap:8px}
.dim span.k{width:38px;flex-shrink:0;font-size:11.5px;color:var(--text-3)}
.dim .dbar{flex:1;height:5px;background:var(--bg-sunken);border-radius:var(--r-pill);overflow:hidden}
.dim .dbar i{display:block;height:100%;width:0;border-radius:var(--r-pill);background:var(--brand-500);transition:width .8s ease}
.dim span.v{width:22px;text-align:right;font-size:11px;color:var(--text-2);font-variant-numeric:tabular-nums}
.rblk{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px}
.rblk .t{font-size:12px;font-weight:600}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reason{padding:3px 8px;background:var(--success-50);border:1px solid var(--success-100);border-radius:var(--r-xs);font-size:11.5px;color:var(--success-500)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 8px;background:var(--bg-page);border-radius:var(--r-xs);font-size:11.5px;color:var(--text-2)}
.tag.warn{background:var(--warning-50);color:var(--warning-500)}
.tpact{display:flex;gap:9px;margin-top:auto}
.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.sechead h2{margin:0;font-size:15px;font-weight:700}
.sechead span{font-size:11.5px;color:var(--text-3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--border-1);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-card);cursor:pointer;transition:.16s}
.pcard:hover{box-shadow:var(--sh-sm);transform:translateY(-1px);border-color:var(--brand-200)}
.pcard .pimg{height:112px;background:linear-gradient(150deg,var(--brand-100),var(--bg-sunken));display:grid;place-items:center;position:relative}
.pcard .pimg span{font-size:11px;color:var(--brand-700);background:#fff;padding:4px 10px;border-radius:var(--r-pill)}
.pcard .pimg b{position:absolute;right:8px;top:8px;padding:3px 8px;border-radius:var(--r-pill);background:rgba(20,97,78,.92);color:#fff;font-size:10.5px;font-weight:600}
.pcard .pbody{padding:11px 13px 12px}
.pcard h3{margin:0;font-size:13.5px;font-weight:600}
.pcard .meta{margin:3px 0 7px;font-size:11px;color:var(--text-3)}
.pcard .pp{font-size:14px;font-weight:700;color:var(--price)}
.pcard .why{margin:6px 0 0;font-size:11px;line-height:1.6;color:var(--success-500)}
.footnote{margin:20px 0 0;text-align:center;font-size:11.5px;line-height:1.7;color:var(--text-3)}

/* ---------- 百科 ---------- */
.wikitop{background:#fff;border-bottom:1px solid var(--border-1)}
.wikitop .wrap{display:flex;align-items:center;gap:18px;height:52px}
.bc{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.bc b{color:var(--text-1);font-weight:600}
.wsearch{margin-left:auto;display:flex;align-items:center;gap:9px;height:33px;padding:0 13px;width:250px;background:var(--bg-page);border:1px solid var(--border-1);border-radius:var(--r-pill);font-size:12px;color:var(--text-4);cursor:text}
.wsearch::before{content:"";width:10px;height:10px;border:1.5px solid var(--text-4);border-radius:50%;flex-shrink:0}

.doc{display:grid;grid-template-columns:190px minmax(0,1fr) 262px;gap:24px;padding:22px 0 44px;align-items:start}
.docleft{position:sticky;top:60px}
.treeh{margin:0 0 7px;font-size:10.5px;letter-spacing:.12em;color:var(--text-4)}
.tree{list-style:none;margin:0;padding:0}
.tree button{
  width:100%;display:flex;align-items:center;justify-content:space-between;padding:7px 9px;
  border:0;border-left:2px solid transparent;border-radius:var(--r-sm);background:transparent;
  font-size:12.5px;color:var(--text-2);cursor:pointer;text-align:left;transition:.14s;
}
.tree button:hover{background:rgba(255,255,255,.7)}
.tree button span{font-size:10.5px;color:var(--text-4)}
.tree button.on{background:#fff;border-left-color:var(--brand-600);color:var(--brand-800);font-weight:600;box-shadow:var(--sh-card)}
.tree button.on span{color:var(--brand-600)}
.treefoot{margin-top:12px;padding-top:11px;border-top:1px solid var(--border-2);font-size:10.5px;color:var(--text-4);line-height:1.6}

.docmain{min-width:0}
.askbox{padding:14px 16px}
.askbox textarea{width:100%;height:52px;border:0;outline:0;resize:none;background:transparent;font-family:inherit;font-size:13.5px;line-height:1.7;color:var(--text-1)}
.askbox textarea::placeholder{color:var(--text-4)}
.askfoot{display:flex;align-items:center;gap:9px;padding-top:10px;border-top:1px solid var(--border-2)}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.chips button{height:25px;padding:0 9px;border:1px solid var(--border-1);border-radius:var(--r-xs);background:transparent;font-size:11px;color:var(--text-3);cursor:pointer;transition:.14s}
.chips button:hover{border-color:var(--brand-300);color:var(--brand-700);background:var(--brand-50)}

.browse{margin-top:14px;padding:14px 16px 6px;background:#fff;border:1px solid var(--border-1);border-radius:var(--r-lg);box-shadow:var(--sh-card)}
.browse-h{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.browse-h b{font-size:12.5px;font-weight:700}
.browse-h span{font-size:11px;color:var(--text-3)}
.browse-h .x{margin-left:auto;border:0;background:transparent;font-size:11px;color:var(--text-3);cursor:pointer}
.bitem{width:100%;display:flex;align-items:center;gap:8px;padding:9px 0;border:0;border-top:1px dashed var(--border-2);background:transparent;text-align:left;cursor:pointer}
.bitem:hover b{color:var(--brand-700)}
.bitem b{font-size:12.5px;font-weight:600;color:var(--text-1);flex-shrink:0}
.bitem em{font-style:normal;font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bitem .go{margin-left:auto;font-size:11px;color:var(--brand-600);flex-shrink:0}

.turn{padding:20px 0 18px;border-bottom:1px solid var(--border-2)}
.turn:first-child{padding-top:18px}
.who{display:flex;align-items:center;gap:8px;margin:0 0 7px;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--text-3)}
.qtext{margin:0 0 16px;font-size:15px;font-weight:600;line-height:1.6}
.ans{font-size:13.5px;line-height:1.85;color:var(--text-1)}
.ans p{margin:0 0 9px}
.ans p:last-child{margin-bottom:0}
.ans ul,.ans ol{margin:5px 0 10px;padding-left:19px}
.ans li{margin:3px 0}
.ans strong{font-weight:650}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.src{
  display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:var(--r-xs);
  background:var(--brand-50);border:1px solid var(--brand-100);font-size:11px;color:var(--brand-700);cursor:pointer;
}
.src b{font-family:var(--mono);font-size:10px}
.src.flash{animation:flash 1.2s}
@keyframes flash{0%,100%{background:var(--brand-50)}30%{background:#ffe9a8;border-color:#f0c96a}}
.thinking{display:flex;align-items:center;gap:5px;padding:14px 0;font-size:12px;color:var(--text-3)}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--brand-400);animation:bnc 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}

const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const FAMILIES = ['猫科','犬科','啮齿','鸟类','水族','爬行'];

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove('on'), 2200);
}

function renderAnswer(text) {
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  for (const raw of String(text || '').split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) { close(); continue; }
    const ul = /^[-*]\s+(.*)$/.exec(line);
    const ol = /^(\d+)[.、)]\s+(.*)$/.exec(line);
    if (ul) {
      if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>');
    } else if (ol) {
      if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + inline(ol[2]) + '</li>');
    } else {
      close();
      out.push('<p>' + inline(line) + '</p>');
    }
  }
  close();
  return out.join('');
}

const mState = { step: 0, answers: {}, view: 'quiz', busy: false };

function totalCount() { return STEPS.reduce((n, s) => n + s.questions.length, 0); }
function doneCount() { return Object.keys(mState.answers).filter(k => mState.answers[k]).length; }
function groupDone(g) { return g.questions.filter(q => mState.answers[q.key]).length; }
function groupAll(g) { return g.questions.every(q => mState.answers[q.key]); }

function renderSteps() {
  $('#steps').innerHTML = STEPS.map((g, i) => {
    const cls = ['step'];
    if (i === mState.step) cls.push('on');
    if (groupAll(g)) cls.push('done');
    return `<button class="${cls.join(' ')}" data-step="${i}">
      <span class="no">${pad(i + 1)}</span>
      <span class="tx"><b>${g.title}</b><em>${g.sub}</em></span>
      <span class="cnt">${groupDone(g)}/${g.questions.length}</span>
    </button>`;
  }).join('');
}

function renderProgress() {
  const d = doneCount(), t = totalCount(), pct = Math.round(d / t * 100);
  $('#progText').textContent = `已完成 ${d} / ${t}`;
  $('#progPct').textContent = pct + '%';
  $('#progBar').style.width = pct + '%';
}

function renderQuestions() {
  const g = STEPS[mState.step];
  $('#qNo').textContent = pad(mState.step + 1);
  $('#qTitle').textContent = g.title;
  $('#qSub').textContent = g.sub;
  $('#qBody').innerHTML = g.questions.map(q => `
    <div class="q">
      <div class="qt">${q.title}${q.hint ? `<span>${q.hint}</span>` : ''}</div>
      <div class="opts">
        ${q.options.map(o => `<button class="opt${mState.answers[q.key] === o.value ? ' on' : ''}" data-k="${q.key}" data-v="${o.value}">
          <b>${o.label}</b>${o.desc ? `<em>${o.desc}</em>` : ''}
        </button>`).join('')}
      </div>
    </div>`).join('');

  $('#dots').innerHTML = STEPS.map((_, i) => `<i class="${i <= mState.step ? 'on' : ''}"></i>`).join('');

  $('#btnPrev').disabled = mState.step === 0;
  const last = mState.step === STEPS.length - 1;
  $('#btnNext').textContent = last ? '开始智能匹配' : '下一步';
  $('#btnNext').classList.toggle('btn--solid', true);
}

function renderQuiz() {
  renderSteps();
  renderProgress();
  renderQuestions();
}

$('#steps').addEventListener('click', e => {
  const b = e.target.closest('.step');
  if (!b) return;
  mState.step = Number(b.dataset.step);
  renderQuiz();
});

$('#qBody').addEventListener('click', e => {
  const b = e.target.closest('.opt');
  if (!b) return;
  mState.answers[b.dataset.k] = b.dataset.v;
  renderQuiz();
});

$('#btnPrev').addEventListener('click', () => {
  if (mState.step > 0) { mState.step--; renderQuiz(); }
});

$('#btnNext').addEventListener('click', () => {
  const g = STEPS[mState.step];
  if (!groupAll(g)) {
    $('#btnNext').classList.remove('shake');
    void $('#btnNext').offsetWidth;
    $('#btnNext').classList.add('shake');
    const left = g.questions.length - groupDone(g);
    toast(`这一步还有 ${left} 题没选`);
    return;
  }
  if (mState.step < STEPS.length - 1) {
    mState.step++;
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    startMatch();
  }
});

/* ---------- 一句话填答 ---------- */
const RULES = [
  { re: /小户型|合租|单间|一居/, k: 'home', v: 'small' },
  { re: /大房|院子|别墅|三层/, k: 'home', v: 'house' },
  { re: /两居|普通住宅|两室/, k: 'home', v: 'apartment' },
  { re: /小孩|孩子|宝宝|儿童/, k: 'kids', v: 'yes' },
  { re: /怕吵|安静|隔音|邻居/, k: 'noise', v: 'low' },
  { re: /宅|不爱出门|家里蹲/, k: 'activity', v: 'low' },
  { re: /跑步|爬山|健身|户外/, k: 'activity', v: 'high' },
  { re: /上班|加班|出差|很忙|没时间/, k: 'time', v: 'lt1' },
  { re: /时间充裕|在家办公|退休|自由职业/, k: 'time', v: 'gt3' },
  { re: /粘人|亲近|陪着我/, k: 'companion', v: 'clingy' },
  { re: /省心|独立|不用管/, k: 'companion', v: 'independent' },
  { re: /第一次|新手|没养过/, k: 'experience', v: 'none' },
  { re: /养过|老手|多年/, k: 'experience', v: 'some' },
  { re: /猫/, k: 'prefer', v: '1' }, { re: /狗|犬/, k: 'prefer', v: '2' },
  { re: /兔/, k: 'prefer', v: '3' }, { re: /仓鼠|鼠/, k: 'prefer', v: '4' },
  { re: /鹦鹉|鸟/, k: 'prefer', v: '5' }, { re: /鱼|水族/, k: 'prefer', v: '6' },
  { re: /龟|爬行|守宫/, k: 'prefer', v: '7' }
];

function parseText(text) {
  const hits = {};
  for (const r of RULES) if (r.re.test(text)) hits[r.k] = r.v;
  const b = /预算\s*(\d{3,6})/.exec(text) || /(\d{3,6})\s*(?:元|块)/.exec(text);
  if (b) {
    const n = Number(b[1]);
    hits.budget = n < 1000 ? '1000' : n < 3000 ? '3000' : n < 6000 ? '6000' : '99999';
    hits.monthly = n < 1000 ? '200' : n < 3000 ? '500' : '1000';
  } else if (!hits.budget) {
    if (/预算不多|预算有限|便宜/.test(text)) { hits.budget = '1000'; hits.monthly = '200'; }
  }
  return hits;
}

/* ---------- 匹配 ---------- */
function scorePet(p, a) {
  let s = 58;
  if (a.home === 'small') s += p.space === 'small' ? 14 : -6;
  else if (a.home === 'apartment') s += p.space === 'apartment' ? 12 : p.space === 'small' ? 9 : 6;
  else s += p.space === 'house' ? 10 : 5;

  if (a.noise === 'low') s += p.quiet ? 11 : -9;
  else if (a.noise === 'mid') s += p.quiet ? 7 : 2;

  if (a.time === 'lt1') s += p.easy ? 10 : -8;
  else if (a.time === 'gt3') s += 6;

  if (a.kids === 'yes') s += p.kid ? 8 : -10;
  if (a.companion === 'clingy') s += p.clingy ? 7 : 1;
  if (a.companion === 'independent') s += p.clingy ? 2 : 7;
  if (a.experience === 'none') s += p.easy ? 6 : -6;

  s += (p.id * 7) % 5;
  return Math.max(56, Math.min(97, s));
}

function reasonsFor(p, a) {
  const r = [];
  if (a.home === 'small' && p.space === 'small') r.push('小户型也能活动开');
  if (a.time === 'lt1' && p.easy) r.push('独处能力强，适合上班族');
  if (a.noise === 'low' && p.quiet) r.push('安静，不易扰邻');
  if (a.kids === 'yes' && p.kid) r.push('对孩子友好');
  if (a.companion === 'clingy' && p.clingy) r.push('主动亲近人');
  if (a.companion === 'independent' && !p.clingy) r.push('独立，不需要全天陪伴');
  if (a.experience === 'none' && p.easy) r.push('新手也能上手');
  if (p.price <= Number(a.budget || 99999)) r.push('在购宠预算内');
  return r.slice(0, 3);
}

function dimsFor(p, a) {
  return {
    '空间': Math.min(98, 62 + (a.home === 'small' ? (p.space === 'small' ? 30 : 4) : 22)),
    '时间': Math.min(98, 60 + (p.easy ? 28 : 8)),
    '预算': Math.min(98, Math.round(100 - (p.price / Math.max(Number(a.budget || 6000), 1)) * 32)),
    '性格': Math.min(98, 64 + (p.clingy === (a.companion === 'clingy') ? 28 : 12)),
    '经验': Math.min(98, p.easy ? 92 : 68),
    '人气': 62 + (p.id * 13) % 33
  };
}

function findIssues(text) {
  const t = text.toLowerCase();
  return ISSUES
    .map(i => {
      let s = 0;
      if (t.includes(i.name.toLowerCase())) s += 10;
      i.kw.forEach(k => { if (t.includes(k.toLowerCase())) s += 4; });
      if (t.includes(i.fam)) s += 1;
      return { i, s };
    })
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s)
    .slice(0, 2)
    .map(x => x.i);
}

function buildAnswer(issue) {
  const steps = issue.solution.split(/[；;]/).filter(Boolean);
  const lines = [
    `**先判断严重程度。** ${issue.name}的典型表现是：${issue.symptoms}。${issue.cause ? '常见诱因包括' + issue.cause + '。' : ''}`,
    '',
    '可以按这个顺序处理：',
    ...steps.map((s, i) => `${i + 1}. ${s.replace(/[。；]$/, '')}`),
    '',
    `预防上，${issue.prevention.replace(/[。]$/, '')}。`,
    '',
    '如果 24 小时内没有好转，或出现持续呕吐、精神萎靡、拒食，请直接联系线下宠物医院。'
  ];
  return lines.join('\n');
}

function ask(text) {
  const q = String(text || '').trim();
  if (!q) { toast('先说一句你想问的'); return; }
  if (wState.loading) return;

  wState.turns.push({ role: 'user', text: q });
  wState.loading = true;
  const box = $('#turns');
  renderTurns();
  box.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  setTimeout(() => {
    const hits = findIssues(q);
    let answer;
    if (hits.length) {
      answer = buildAnswer(hits[0]);
    } else {
      answer = [
        '知识库里没有完全匹配的条目。',
        '',
        '可以换个说法再试，比如把症状描述得更具体：',
        '- 从什么时候开始、持续多久',
        '- 精神与食欲有没有变化',
        '- 排便、呕吐、皮肤等可观察的细节',
        '',
        '如果症状正在加重，建议直接联系线下宠物医院。'
      ].join('\n');
    }
    wState.turns.push({ role: 'doc', text: answer, hits });
    wState.loading = false;
    wState.hits = hits;
    renderTurns();
    renderHits();
  }, 950);
}

/* 事件绑定 */
$('#tree').addEventListener('click', e => {
  const b = e.target.closest('button[data-fam]');
  if (!b) return;
  wState.fam = b.dataset.fam;
  wState.browse = true;
  renderTree(); renderChips(); renderBrowse();
});

$('#wChips').addEventListener('click', e => {
  const b = e.target.closest('button[data-q]');
  if (b) ask(b.dataset.q);
});

$('#browseBox').addEventListener('click', e => {
  const b = e.target.closest('.bitem');
  if (b) ask(b.dataset.q);
});

$('#btnAsk').addEventListener('click', () => { ask($('#wq').value); $('#wq').value = ''; });

$('#wq').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { $('#btnAsk').click(); }
});

$('#hits').addEventListener('click', e => {
  const b = e.target.closest('.hitcard');
  if (!b) return;
  const id = Number(b.dataset.issue);
  const issue = ISSUES.find(i => i.id === id);
  document.querySelectorAll('.hitcard').forEach(x => x.classList.toggle('on', x === b));
  const chip = document.querySelector(`.src[data-issue="${id}"]`);
  if (chip) {
    chip.scrollIntoView({ behavior: 'smooth', block: 'center' });
    chip.classList.remove('flash');
    void chip.offsetWidth;
    chip.classList.add('flash');
  } else if (issue) {
    toast('该条目尚未在这次回答中引用');
  }
});

$('#sug').addEventListener('click', e => {
  const b = e.target.closest('button[data-q]');
  if (b) { ask(b.dataset.q); window.scrollTo({ top: 200, behavior: 'smooth' }); }
});

function resetWiki() {
  wState.turns = [];
  wState.hits = [];
  wState.loading = false;
  wState.fam = '猫科';
  wState.browse = true;
  $('#wq').value = '';
  renderTree(); renderChips(); renderBrowse(); renderTurns(); renderHits();
}

/* ================================================================
   5. 页面切换 / 初始化
   ================================================================ */
function showPage(p) {
  $('#pageMatch').hidden = p !== 'match';
  $('#pageWiki').hidden = p !== 'wiki';
  document.querySelectorAll('#pageSeg button').forEach(b => b.classList.toggle('on', b.dataset.page === p));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('#pageSeg').addEventListener('click', e => {
  const b = e.target.closest('button[data-page]');
  if (b) showPage(b.dataset.page);
});

document.querySelectorAll('[data-go]').forEach(b => {
  b.addEventListener('click', () => showPage(b.dataset.go));
});

$('#btnReset').addEventListener('click', () => {
  const isMatch = !$('#pageMatch').hidden;
  if (isMatch) resetMatch(); else resetWiki();
  toast('已重置本页');
});

renderQuiz();
renderTree();
renderChips();
renderBrowse();
renderTurns();
renderHits();
</script>
</body>
</html>
